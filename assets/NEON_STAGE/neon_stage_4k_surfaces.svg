<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1536" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc"><title id="title">NEON STAGE DEFAULT — 4K surface library</title><desc id="desc">Vector surface symbols derived from the immutable GitHub master layout: dark stage, machined-metal console, layered frames, panels and dividers.</desc><defs>
<linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090D"/><stop offset=".55" stop-color="#14161B"/><stop offset="1" stop-color="#20232B"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D9D7DF"/><stop offset=".22" stop-color="#656B76"/><stop offset=".55" stop-color="#292D36"/><stop offset="1" stop-color="#090A0E"/></linearGradient>
<linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7B2C91"/><stop offset=".52" stop-color="#E6007E"/><stop offset="1" stop-color="#D7264D"/></linearGradient>
<radialGradient id="pinkGlow"><stop stop-color="#E6007E" stop-opacity=".5"/><stop offset="1" stop-color="#E6007E" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="brushed" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 1H10M0 5H10M0 9H10" stroke="#D9D7DF" stroke-opacity=".035"/></pattern>
</defs>
<symbol id="ns-stage-background" viewBox="0 0 1800 720"><rect width="1800" height="720" fill="url(#stage)"/><rect width="1800" height="720" fill="url(#brushed)"/><path d="M80 0L450 720M1720 0L1350 720" stroke="#7B2C91" stroke-opacity=".14" stroke-width="2"/><path d="M0 635H1800" stroke="url(#magenta)" stroke-width="2" opacity=".9"/><path d="M0 641H1800" stroke="#7B2C91" stroke-opacity=".22" stroke-width="14" filter="url(#glow)"/></symbol>
<symbol id="ns-console-outer-frame" viewBox="0 0 1050 560"><rect x="1" y="1" width="1048" height="558" rx="28" fill="#030305" stroke="#656B76" stroke-width="2" filter="url(#shadow)"/><rect x="8" y="8" width="1034" height="544" rx="22" fill="url(#stage)" stroke="#656B76" stroke-width="2"/><rect x="8" y="8" width="1034" height="544" rx="22" fill="url(#brushed)" opacity=".8"/><path d="M28 84H1022" stroke="url(#magenta)" stroke-width="2" opacity=".9"/></symbol>
<symbol id="ns-panel" viewBox="0 0 982 182"><rect x="1" y="1" width="980" height="180" rx="14" fill="#08090D" stroke="#656B76" stroke-width="2"/><path d="M14 2H968" stroke="#D9D7DF" stroke-opacity=".16"/><path d="M14 180H968" stroke="#030305" stroke-opacity=".9"/></symbol>
<symbol id="ns-header-strip" viewBox="0 0 982 54"><rect x="1" y="1" width="980" height="52" rx="12" fill="#0E1015" stroke="#656B76"/><path d="M12 2H970" stroke="#D9D7DF" stroke-opacity=".18"/><path d="M8 51H974" stroke="url(#magenta)" stroke-opacity=".7"/></symbol>
<symbol id="ns-footer-strip" viewBox="0 0 982 25"><rect x=".5" y=".5" width="981" height="24" rx="5" fill="#08090D" stroke="#656B76"/><path d="M8 2H974" stroke="#D9D7DF" stroke-opacity=".12"/></symbol>
<symbol id="ns-divider" viewBox="0 0 600 4"><path d="M0 2H600" stroke="#656B76" stroke-width="1"/><path d="M0 2H600" stroke="url(#magenta)" stroke-width="1" opacity=".65"/></symbol>
<symbol id="ns-card-frame" viewBox="0 0 474 54"><rect x="1" y="1" width="472" height="52" rx="12" fill="#0E1015" stroke="#656B76"/><path d="M12 2H462" stroke="#D9D7DF" stroke-opacity=".12"/></symbol>
<symbol id="ns-microtexture" viewBox="0 0 1800 720"><rect width="1800" height="720" fill="url(#brushed)"/></symbol>
</svg>