<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1536" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc"><title id="title">NEON STAGE DEFAULT — 4K control library</title><desc id="desc">Reusable native-control artwork with graphite and machined-silver construction and magenta, purple and crimson accents. Interactive states are visual states only; native JUCE controls remain responsible for behavior.</desc><defs>
<linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090D"/><stop offset=".55" stop-color="#14161B"/><stop offset="1" stop-color="#20232B"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D9D7DF"/><stop offset=".22" stop-color="#656B76"/><stop offset=".55" stop-color="#292D36"/><stop offset="1" stop-color="#090A0E"/></linearGradient>
<linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7B2C91"/><stop offset=".52" stop-color="#E6007E"/><stop offset="1" stop-color="#D7264D"/></linearGradient>
<radialGradient id="pinkGlow"><stop stop-color="#E6007E" stop-opacity=".5"/><stop offset="1" stop-color="#E6007E" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="brushed" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 1H10M0 5H10M0 9H10" stroke="#D9D7DF" stroke-opacity=".035"/></pattern>
</defs>
<symbol id="ns-knob-base" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#08090D" stroke="#656B76" stroke-width="5"/><circle cx="50" cy="50" r="39" fill="url(#metal)" stroke="#090A0E" stroke-width="2"/><circle cx="50" cy="50" r="31" fill="#14161B" stroke="#292D36" stroke-width="2"/><circle cx="50" cy="50" r="25" fill="#20232B" stroke="#656B76" stroke-width="1.5"/><path d="M50 50L50 27" stroke="#F2F0F4" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#B9B5BF"/></symbol>
<symbol id="ns-knob-default" viewBox="0 0 100 100"><use href="#ns-knob-base"/><path d="M50 5A45 45 0 0 1 95 50" fill="none" stroke="#7B2C91" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="ns-knob-hover" viewBox="0 0 100 100"><use href="#ns-knob-base"/><circle cx="50" cy="50" r="48" fill="none" stroke="#E6007E" stroke-width="2" filter="url(#glow)"/></symbol>
<symbol id="ns-knob-pressed" viewBox="0 0 100 100"><use href="#ns-knob-base"/><circle cx="50" cy="50" r="33" fill="none" stroke="#D7264D" stroke-width="3"/></symbol>
<symbol id="ns-knob-disabled" viewBox="0 0 100 100"><use href="#ns-knob-base" opacity=".38"/></symbol>
<symbol id="ns-button-default" viewBox="0 0 220 54"><rect x="1" y="1" width="218" height="52" rx="9" fill="#14161B" stroke="#656B76" stroke-width="2"/><path d="M10 3H210" stroke="#D9D7DF" stroke-opacity=".2"/><rect x="5" y="5" width="210" height="44" rx="6" fill="url(#brushed)" opacity=".7"/></symbol>
<symbol id="ns-button-active" viewBox="0 0 220 54"><rect x="1" y="1" width="218" height="52" rx="9" fill="#20232B" stroke="#E6007E" stroke-width="2"/><path d="M10 3H210" stroke="#F2F0F4" stroke-opacity=".28"/><path d="M8 49H212" stroke="url(#magenta)" stroke-width="2" filter="url(#glow)"/></symbol>
<symbol id="ns-button-pressed" viewBox="0 0 220 54"><rect x="2" y="3" width="216" height="49" rx="9" fill="#0E1015" stroke="#7B2C91" stroke-width="2"/><path d="M10 50H210" stroke="#D7264D" stroke-width="2"/></symbol>
<symbol id="ns-button-disabled" viewBox="0 0 220 54"><rect x="1" y="1" width="218" height="52" rx="9" fill="#14161B" stroke="#38313B" stroke-width="2" opacity=".55"/></symbol>
<symbol id="ns-toggle-off" viewBox="0 0 72 34"><rect x="1" y="1" width="70" height="32" rx="16" fill="#0E1015" stroke="#656B76" stroke-width="2"/><circle cx="18" cy="17" r="12" fill="url(#metal)" stroke="#090A0E"/></symbol>
<symbol id="ns-toggle-on" viewBox="0 0 72 34"><rect x="1" y="1" width="70" height="32" rx="16" fill="#20232B" stroke="#E6007E" stroke-width="2"/><circle cx="54" cy="17" r="12" fill="#E6007E" stroke="#F2F0F4" stroke-opacity=".5" filter="url(#glow)"/></symbol>
<symbol id="ns-slider-track" viewBox="0 0 240 30"><rect x="1" y="9" width="238" height="12" rx="6" fill="#08090D" stroke="#656B76"/><rect x="4" y="12" width="116" height="6" rx="3" fill="url(#magenta)"/></symbol>
<symbol id="ns-slider-thumb" viewBox="0 0 30 44"><rect x="2" y="1" width="26" height="42" rx="6" fill="url(#metal)" stroke="#090A0E" stroke-width="2"/><path d="M9 7V37M15 7V37M21 7V37" stroke="#20232B" stroke-width="1"/></symbol>
<symbol id="ns-tab-active" viewBox="0 0 222 40"><rect x="1" y="1" width="220" height="38" rx="8" fill="#20232B" stroke="#E6007E" stroke-width="2"/><path d="M10 37H212" stroke="url(#magenta)" stroke-width="2"/></symbol>
<symbol id="ns-tab-inactive" viewBox="0 0 228 40"><rect x="1" y="1" width="226" height="38" rx="8" fill="#14161B" stroke="#656B76"/></symbol>
<symbol id="ns-selector" viewBox="0 0 300 42"><rect x="1" y="1" width="298" height="40" rx="7" fill="#0E1015" stroke="#656B76"/><path d="M268 1V41" stroke="#656B76"/><path d="M280 16L286 23L292 16" fill="none" stroke="#E6007E" stroke-width="2"/></symbol>
</svg>