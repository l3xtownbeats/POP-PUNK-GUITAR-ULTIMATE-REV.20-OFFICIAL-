name: REV.20 one-time source consolidation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rev20-one-time-import.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout REV.20 main with write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import approved source and commit consolidated baseline
        run: python tools/rev20_one_time_import.py
