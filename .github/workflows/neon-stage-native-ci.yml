name: NEON STAGE native integration CI

on:
  push:
    branches:
      - feat/neon-stage-manager-3-native-integration
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/**"
      - "tools/package_active_skins.py"
      - "tools/validate_skin_registry_16.py"
      - ".github/workflows/neon-stage-native-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/**"
      - "tools/package_active_skins.py"
      - "tools/validate_skin_registry_16.py"
      - ".github/workflows/neon-stage-native-ci.yml"

permissions:
  contents: read

concurrency:
  group: neon-stage-native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / JUCE ${{ matrix.juce-version }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        juce-version: ["7.0.12", "9.0.5"]
    timeout-minutes: 45
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install asset validation dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Checkout JUCE ${{ matrix.juce-version }}
        shell: pwsh
        run: git clone --depth 1 --branch ${{ matrix.juce-version }} https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build VST3 and all C++ contract tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run full CTest suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate 16-skin registry
        shell: pwsh
        run: python tools/validate_skin_registry_16.py

      - name: Stage runtime skin pack in build directory
        shell: pwsh
        run: python tools/package_active_skins.py --root SKIN --output build/PPGU_artefacts/Release/VST3/Skins

      - name: Upload VST3 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-REV20-Windows-x64-JUCE-${{ matrix.juce-version }}-VST3
          path: build/PPGU_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 14
