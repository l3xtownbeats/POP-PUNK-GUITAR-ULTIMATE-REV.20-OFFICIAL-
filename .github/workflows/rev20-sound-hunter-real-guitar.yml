name: REV.20 Sound Hunter — real recorded guitar library

on:
  workflow_dispatch:
    inputs:
      acquire_samples:
        description: "Download/verify/import approved real-recorded guitar sources"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sound-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact REV.20 main
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover approved real-recorded sources
        run: python3 SoundHunter/sound_hunter_real_guitars.py --discover-only

      - name: Run Sound Hunter regression contracts
        run: |
          python3 tests/test_sound_hunter_importer.py
          python3 tests/test_audit_soundbank_policy.py
          python3 tests/test_artifact_splitter.py

      - name: Acquire and verify real guitar audio
        if: ${{ inputs.acquire_samples }}
        run: python3 SoundHunter/sound_hunter_real_guitars.py

      - name: Audit acquired Samples
        if: ${{ inputs.acquire_samples }}
        run: python3 tools/audit_soundbank.py

      - name: Package and SHA-verify acquired library
        if: ${{ inputs.acquire_samples }}
        shell: bash
        run: |
          zip -qr "$RUNNER_TEMP/PPGU_REV20_REAL_GUITAR_SAMPLES.zip" Samples/SoundHunterImports
          python3 tools/split_artifact.py split \
            --input "$RUNNER_TEMP/PPGU_REV20_REAL_GUITAR_SAMPLES.zip" \
            --output-dir "$RUNNER_TEMP" \
            --prefix PPGU_REV20_REAL_GUITAR_SAMPLES \
            --part-size-mb 1800
          python3 tools/split_artifact.py verify \
            --manifest "$RUNNER_TEMP/PPGU_REV20_REAL_GUITAR_SAMPLES_PARTS_MANIFEST.json"

      - name: Upload verified library package
        if: ${{ inputs.acquire_samples }}
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-REV20-REAL-GUITAR-SAMPLES
          path: |
            ${{ runner.temp }}/PPGU_REV20_REAL_GUITAR_SAMPLES.part-*
            ${{ runner.temp }}/PPGU_REV20_REAL_GUITAR_SAMPLES_PARTS_SHA256SUMS.txt
            ${{ runner.temp }}/PPGU_REV20_REAL_GUITAR_SAMPLES_PARTS_MANIFEST.json
            Samples/SoundHunterImports/**/SOUND_HUNTER_REGISTRY.json
          if-no-files-found: error
          retention-days: 30
