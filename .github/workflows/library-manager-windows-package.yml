name: Library Manager Windows Package
on:
  workflow_dispatch:
  push:
    paths:
      - "LibraryManager/**"
      - ".github/workflows/library-manager-windows-package.yml"
  pull_request:
    paths:
      - "LibraryManager/**"
      - ".github/workflows/library-manager-windows-package.yml"
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install -r LibraryManager/requirements.txt
          python -m pip install -r LibraryManager/requirements-build.txt
      - name: Build portable folder
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name POP_PUNK_GUITAR_LIBRARY_MANAGER --paths LibraryManager --add-data "LibraryManager/PORTABLE_USER_GUIDE_RU.md;." --collect-all soundfile --collect-all _soundfile_data --distpath dist LibraryManager/manager_gui.py
      - name: Verify executable and archive
        shell: pwsh
        run: |
          $exe = "dist/POP_PUNK_GUITAR_LIBRARY_MANAGER/POP_PUNK_GUITAR_LIBRARY_MANAGER.exe"
          if (!(Test-Path $exe)) { throw "Portable GUI executable was not produced: $exe" }
          # Require the embedded CPython runtime inside the distributable folder.
          $pythonRuntime = Get-ChildItem "dist/POP_PUNK_GUITAR_LIBRARY_MANAGER" -Recurse -Filter "python311.dll" | Select-Object -First 1
          if (!$pythonRuntime) { throw "Bundled python311.dll is missing; package is not self-contained." }
          $userGuide = Get-ChildItem "dist/POP_PUNK_GUITAR_LIBRARY_MANAGER" -Recurse -Filter "PORTABLE_USER_GUIDE_RU.md" | Select-Object -First 1
          if (!$userGuide) { throw "Russian user guide is missing from the portable package." }
          # Smoke-test with PATH restricted to Windows system folders. PyInstaller
          # must provide its own Python runtime and bundled dependencies.
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $p = Start-Process -FilePath (Resolve-Path $exe) -PassThru
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited) { throw "Portable app exited during startup (code $($p.ExitCode))." }
            Stop-Process -Id $p.Id -Force
          } finally { $env:PATH = $oldPath }
          $zip = "dist/POP_PUNK_GUITAR_LIBRARY_MANAGER-windows-x64.zip"
          Compress-Archive -Path dist/POP_PUNK_GUITAR_LIBRARY_MANAGER -DestinationPath $zip
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 1024) { throw "Portable ZIP is missing or unexpectedly small." }
          $entries = tar -tf $zip
          if ($LASTEXITCODE -ne 0 -or !($entries -match "POP_PUNK_GUITAR_LIBRARY_MANAGER.exe")) { throw "Portable ZIP does not contain the GUI executable." }
          if (!($entries -match "python311.dll")) { throw "Portable ZIP does not contain its bundled Python runtime." }
          if (!($entries -match "PORTABLE_USER_GUIDE_RU.md")) { throw "Portable ZIP does not contain the Russian user guide." }
      - uses: actions/upload-artifact@v4
        with:
          name: POP-PUNK-GUITAR-LIBRARY-MANAGER-Windows-x64
          path: dist/POP_PUNK_GUITAR_LIBRARY_MANAGER-windows-x64.zip
          if-no-files-found: error
