name: REV.20 Windows x64 VST3 and 16-skin validation

on:
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/**"
      - ".gitattributes"
      - "assets/library/**"
      - "tools/validate_skin_registry_16.py"
      - "tools/generate_neon_stage_spritesheets.py"
      - "tools/package_active_skins.py"
      - "tools/validate_library_tiers.py"
      - "SoundHunter/**"
      - "tools/audit_soundbank.py"
      - "tools/split_artifact.py"
      - "tools/sfz_path_safety.py"
      - ".github/workflows/rev20-windows-vst3-skin-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/**"
      - ".gitattributes"
      - "assets/library/**"
      - "tools/validate_skin_registry_16.py"
      - "tools/generate_neon_stage_spritesheets.py"
      - "tools/package_active_skins.py"
      - "tools/validate_library_tiers.py"
      - "SoundHunter/**"
      - "tools/audit_soundbank.py"
      - "tools/split_artifact.py"
      - "tools/sfz_path_safety.py"
      - ".github/workflows/rev20-windows-vst3-skin-validation.yml"
  workflow_dispatch:

concurrency:
  group: rev20-windows-x64-vst3-skin-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-x64-vst3:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout exact REV.20 main commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sprite atlas generator dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate canonical NEON STAGE sprite atlases
        shell: pwsh
        run: python tools/generate_neon_stage_spritesheets.py

      # Generated atlases stay inside this build workspace. The build must never
      # push back to main: that creates a second run and can cancel the release build.
      - name: Checkout JUCE 9.0.6
        shell: pwsh
        run: git clone --depth 1 --branch 9.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build VST3 and all C++ contract tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run full CTest suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload rendered NEON STAGE UI snapshots at reference sizes
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-NEON-STAGE-JUCE-UI-SNAPSHOTS
          path: |
            build/ui-snapshots/*.png
            build/ui-snapshots/PPGU_NEON_STAGE_UI_SNAPSHOTS.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate exactly 16 named graphical skins and all artwork assets
        shell: pwsh
        run: python tools/validate_skin_registry_16.py

      - name: Stage exactly 16 approved skin folders beside VST3
        shell: pwsh
        run: python tools/package_active_skins.py --root SKIN --output build/PPGU_artefacts/Release/VST3/Skins

      - name: Locate VST3 bundle
        id: vst3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = Get-ChildItem build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found after successful build.' }
          "path=$($plugin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run pluginval strictness level 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          $toolDir = Join-Path $env:RUNNER_TEMP 'pluginval'
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $archive -TimeoutSec 180
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          $validator = Get-ChildItem -LiteralPath $toolDir -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $validator) { throw 'pluginval.exe was not found in the official Windows release archive.' }
          $pluginPath = "${{ steps.vst3.outputs.path }}"
          $arguments = @('--strictness-level', '5', ('"{0}"' -f $pluginPath))
          $validationProcess = Start-Process -FilePath $validator.FullName -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($validationProcess.ExitCode -ne 0) {
            throw "pluginval strictness level 5 failed with exit code $($validationProcess.ExitCode)."
          }

      - name: Upload REV.20 Windows x64 VST3 and matching 16-skin pack
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-REV20-Windows-x64-VST3
          path: |
            build/PPGU_artefacts/Release/VST3/*.vst3
            build/PPGU_artefacts/Release/VST3/Skins/**
          if-no-files-found: error
          retention-days: 14

  # C++26 is evaluated separately and is deliberately non-blocking while
  # compiler/library support is still evolving. C++23 remains the release gate.
  windows-x64-cpp26-compatibility:
    name: Windows x64 C++26 experimental compatibility
    continue-on-error: true
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sprite atlas generator dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate canonical NEON STAGE sprite atlases
        shell: pwsh
        run: python tools/generate_neon_stage_spritesheets.py

      - name: Checkout JUCE 9.0.6
        shell: pwsh
        run: git clone --depth 1 --branch 9.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure experimental C++26 build
        shell: pwsh
        run: cmake -S . -B build-cpp26 -A x64 -DPPGU_CXX_STANDARD=26

      - name: Build VST3 and all C++ contract tests with C++26
        shell: pwsh
        run: cmake --build build-cpp26 --config Release --parallel

      - name: Run full CTest suite with C++26
        shell: pwsh
        run: ctest --test-dir build-cpp26 -C Release --output-on-failure
