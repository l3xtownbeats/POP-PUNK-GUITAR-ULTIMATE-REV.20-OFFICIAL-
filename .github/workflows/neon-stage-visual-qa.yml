name: NEON STAGE visual asset baseline

on:
  push:
    branches:
      - qa/neon-stage-render-performance-audit
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/Skin_053/**"
      - "tools/audit_neon_stage_assets.py"
      - "tools/generate_neon_stage_spritesheets.py"
      - ".github/workflows/neon-stage-visual-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/Skin_053/**"
      - "tools/audit_neon_stage_assets.py"
      - "tools/generate_neon_stage_spritesheets.py"
      - ".github/workflows/neon-stage-visual-qa.yml"

permissions:
  contents: write

concurrency:
  group: neon-stage-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Regenerate canonical NEON STAGE atlases
        run: python tools/generate_neon_stage_spritesheets.py

      - name: Commit regenerated atlas PNGs and manifest to QA branch
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKIN/Skin_053/assets/spritesheets/*.png SKIN/Skin_053/assets/spritesheets/neon_stage_spritesheet_manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Regenerate cyan and electric-blue NEON STAGE atlases"
            $target = "${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:$target"
          }

      - name: Validate NEON STAGE structural contract
        run: python tests/test_neon_stage_contract.py

      - name: Audit PNG integrity, dimensions, alpha, hashes and forbidden formats
        shell: pwsh
        run: |
          python tools/audit_neon_stage_assets.py --report build/neon-stage-asset-audit.json --report-only
          if (-not (Test-Path build/neon-stage-asset-audit.json)) { throw "Asset audit report was not generated." }

      - name: Checkout JUCE 7.0.12
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Windows x64
        run: cmake -S . -B build -A x64

      - name: Build VST3 and contract tests
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEON-STAGE-visual-QA-report
          path: build/neon-stage-asset-audit.json
          if-no-files-found: warn
          retention-days: 14
