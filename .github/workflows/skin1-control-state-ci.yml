name: SKIN-1 control-state runtime CI

on:
  push:
    branches:
      - feat/skin1-control-state-runtime
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/Skin_053/**"
      - ".gitattributes"
      - "tools/package_active_skins.py"
      - ".github/workflows/skin1-control-state-ci.yml"

permissions:
  contents: read

concurrency:
  group: skin1-control-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NEON STAGE asset generator dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate canonical NEON STAGE sprite atlases
        shell: pwsh
        run: python tools/generate_neon_stage_spritesheets.py

      - name: Checkout JUCE 9.0.6
        shell: pwsh
        run: git clone --depth 1 --branch 9.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build VST3 and contract tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload rendered NEON STAGE UI snapshots at reference sizes
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-NEON-STAGE-JUCE-UI-SNAPSHOTS
          path: |
            build/ui-snapshots/*.png
            build/ui-snapshots/PPGU_NEON_STAGE_UI_SNAPSHOTS.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate 16-skin registry
        shell: pwsh
        run: python tools/validate_skin_registry_16.py

      - name: Stage approved skin pack
        shell: pwsh
        run: python tools/package_active_skins.py --root SKIN --output build/PPGU_artefacts/Release/VST3/Skins

      - name: Upload build and skin package
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SKIN1-control-state-CI
          path: |
            build/PPGU_artefacts/Release/VST3/*.vst3
            build/PPGU_artefacts/Release/VST3/Skins/**
          if-no-files-found: error
          retention-days: 14
