name: SKIN-1 control-state runtime CI

on:
  push:
    branches:
      - feat/skin1-control-state-runtime
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/Skin_053/**"
      - "tools/package_active_skins.py"
      - "tools/migrate_neon_stage_png.py"
      - "tools/migrate_skin_studio_png.py"
      - "tools/render_neon_stage_svg.cjs"
      - ".github/workflows/skin1-control-state-ci.yml"

permissions:
  contents: read

concurrency:
  group: skin1-control-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-skin1-png:
    name: Prepare audited Skin-1 PNG artwork (Linux renderer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PNG migration dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy

      - name: Install deterministic Arial-compatible font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation2

      - name: Install deterministic Resvg renderer
        run: npm install --no-save --no-package-lock @resvg/resvg-js

      - name: Render and audit Skin-1 PNG artwork
        run: python tools/migrate_neon_stage_png.py

      - name: Render all 15 Skin Studio themes to 1x/2x/3x PNG
        run: python tools/migrate_skin_studio_png.py

      - name: Upload complete audited theme PNG artwork
        uses: actions/upload-artifact@v4
        with:
          name: ppgu-skin1-png-migration
          path: |
            SKIN/Skin_053/assets/png_migration/
            SKIN/Skin_*/assets/png_migration/**
            SKIN/Skin_*/theme.json
            SKIN/skin_studio_png_migration_manifest.json
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    needs: prepare-skin1-png
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download audited PNG artwork before configure/build/CTest
        uses: actions/download-artifact@v4
        with:
          name: ppgu-skin1-png-migration
          path: .

      - name: Install PNG validation dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Checkout JUCE 7.0.12
        shell: pwsh
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build VST3 and contract tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate 16-skin registry
        shell: pwsh
        run: python tools/validate_skin_registry_16.py

      - name: Stage approved skin pack
        shell: pwsh
        run: python tools/package_active_skins.py --root SKIN --output build/PPGU_artefacts/Release/VST3/Skins

      - name: Upload build and skin package
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-SKIN1-control-state-CI
          path: |
            build/PPGU_artefacts/Release/VST3/*.vst3
            build/PPGU_artefacts/Release/VST3/Skins/**
          if-no-files-found: error
          retention-days: 14
