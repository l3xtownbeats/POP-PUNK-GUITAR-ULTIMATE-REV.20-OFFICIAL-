name: Library Manager Tests
on:
  push:
    branches:
      - "release/3.0-final"
    paths:
      - "LibraryManager/**"
      - ".github/workflows/library-manager-tests.yml"
  pull_request:
    paths:
      - "LibraryManager/**"
      - ".github/workflows/library-manager-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio decoder dependencies
        run: python -m pip install -r LibraryManager/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q LibraryManager
      - name: Run Library Manager regression tests
        working-directory: LibraryManager
        run: python -m unittest discover -v -p "test_*.py"
