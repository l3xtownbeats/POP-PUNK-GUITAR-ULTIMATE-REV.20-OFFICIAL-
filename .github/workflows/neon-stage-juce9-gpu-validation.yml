name: NEON STAGE JUCE 9.0.5 GPU renderer validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "tests/**"
      - "SKIN/**"
      - "tools/package_active_skins.py"
      - "tools/validate_skin_registry_16.py"
      - ".github/workflows/neon-stage-juce9-gpu-validation.yml"

permissions:
  contents: read

concurrency:
  group: neon-stage-juce9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-juce9:
    name: Windows x64 / JUCE 9.0.5 / Direct2D candidate
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install artwork validation dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Checkout JUCE 9.0.5
        shell: pwsh
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build VST3 and C++ contract tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run full CTest suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate 16-skin registry
        shell: pwsh
        run: python tools/validate_skin_registry_16.py

      - name: Stage runtime skin pack
        shell: pwsh
        run: python tools/package_active_skins.py --root SKIN --output build/PPGU_artefacts/Release/VST3/Skins

      - name: Upload JUCE 9.0.5 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPGU-REV20-JUCE-9.0.5-Windows-x64-VST3-validation
          path: build/PPGU_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 14
